<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffe46b" />
  <title>Para mi pequeña damita 💛</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #fff5b8;
    }

    body {
      min-height: 100svh;
    }

    .scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 20%, rgba(255,255,255,.95), transparent 27%),
        linear-gradient(
          180deg,
          #fffce7 0%,
          #fff2ad 45%,
          #ffd967 100%
        );
    }

    /* ==============================
       CIELO
    ============================== */

    .sun {
      position: absolute;
      top: 7%;
      right: 8%;
      width: min(17vw, 120px);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 35% 35%,
          #fffbd0,
          #ffe553 55%,
          #ffc725 100%
        );
      box-shadow:
        0 0 0 20px rgba(255, 225, 80, .15),
        0 0 90px rgba(255, 218, 45, .5);
      animation: sunPulse 4s ease-in-out infinite alternate;
    }

    @keyframes sunPulse {
      to {
        transform: scale(1.07);
      }
    }

    .cloud {
      position: absolute;
      width: 130px;
      height: 48px;
      border-radius: 999px;
      background: rgba(255,255,255,.82);
      box-shadow:
        25px -12px 0 8px rgba(255,255,255,.85),
        58px -5px 0 3px rgba(255,255,255,.85),
        78px -15px 0 12px rgba(255,255,255,.8);
      animation: cloudMove linear infinite;
    }

    .cloud1 {
      top: 12%;
      left: -220px;
      animation-duration: 32s;
    }

    .cloud2 {
      top: 23%;
      left: -300px;
      transform: scale(.8);
      animation-duration: 42s;
      animation-delay: -12s;
    }

    @keyframes cloudMove {
      to {
        transform: translateX(calc(100vw + 500px));
      }
    }

    /* ==============================
       TITULO
    ============================== */

    .header {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 850px);
      text-align: center;
      z-index: 20;
      transition: 1s ease;
    }

    .header small {
      display: block;
      margin-bottom: 7px;
      color: #9b721c;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .17em;
    }

    .header h1 {
      font-size: clamp(2rem, 6vw, 4.7rem);
      line-height: 1;
      color: #65420e;
      text-shadow: 0 2px 0 rgba(255,255,255,.7);
    }

    .header p {
      margin: 12px auto 0;
      max-width: 700px;
      color: #79561d;
      font-weight: 600;
      font-size: clamp(.95rem, 2.4vw, 1.2rem);
    }

    .heart {
      display: inline-block;
      animation: heartbeat 1.4s infinite;
    }

    @keyframes heartbeat {
      0%,100% {
        transform: scale(1);
      }

      15% {
        transform: scale(1.18);
      }

      30% {
        transform: scale(1);
      }

      45% {
        transform: scale(1.1);
      }
    }

    /* ==============================
       SUELO
    ============================== */

    .ground {
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -40px;
      height: 30vh;
      min-height: 170px;
      border-radius: 50% 50% 0 0 / 65% 65% 0 0;
      background:
        linear-gradient(
          180deg,
          #9bd375,
          #6ead59 45%,
          #438246
        );
      z-index: 2;
    }

    /* ==============================
       PERSONAJES
    ============================== */

    .characters {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 14vh;
      height: min(44vh, 350px);
      z-index: 10;
      transition: 1.3s ease;
    }

    .boy,
    .girl {
      position: absolute;
      bottom: 0;
      transform-origin: 50% 100%;
    }

    .boy {
      left: -180px;
      width: 250px;
      height: 330px;
      animation: boyWalk 9s ease-in-out infinite;
    }

    @keyframes boyWalk {
      0% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(100px);
      }

      42% {
        transform: translateX(235px);
      }

      58% {
        transform: translateX(330px);
      }

      75% {
        transform: translateX(340px);
      }

      100% {
        transform: translateX(0);
      }
    }

    .girl {
      right: 8%;
      width: 170px;
      height: 285px;
      animation: girlBounce 3s ease-in-out infinite;
    }

    @keyframes girlBounce {
      50% {
        transform: translateY(-6px);
      }
    }

    .head {
      position: absolute;
      background: #f1c39a;
      border-radius: 50%;
      z-index: 4;
    }

    .hair {
      position: absolute;
      background: #493021;
      z-index: 5;
    }

    .body {
      position: absolute;
      z-index: 3;
    }

    .eye {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #3d281c;
      z-index: 6;
    }

    .smile {
      position: absolute;
      border: 3px solid transparent;
      border-bottom-color: #9a5b48;
      border-radius: 0 0 20px 20px;
      z-index: 6;
    }

    .arm,
    .leg {
      position: absolute;
      z-index: 2;
    }

    .limb {
      width: 16px;
      border-radius: 999px;
    }

    .arm .limb {
      height: 70px;
      background: #f1c39a;
    }

    .leg .limb {
      height: 85px;
      background: #4d68ab;
    }

    .shoe {
      position: absolute;
      bottom: -2px;
      left: -5px;
      width: 28px;
      height: 12px;
      border-radius: 12px;
      background: #39291f;
    }

    /* NIÑO */

    .boy .head {
      left: 98px;
      top: 20px;
      width: 58px;
      height: 58px;
    }

    .boy .hair {
      left: 96px;
      top: 17px;
      width: 62px;
      height: 31px;
      border-radius: 50px 50px 18px 18px;
    }

    .boy .body {
      left: 82px;
      top: 74px;
      width: 92px;
      height: 110px;
      border-radius: 28px;
      background: linear-gradient(#ffe985, #ffd233);
    }

    .boy .eye1 {
      left: 116px;
      top: 45px;
    }

    .boy .eye2 {
      left: 136px;
      top: 45px;
    }

    .boy .smile {
      left: 119px;
      top: 56px;
      width: 18px;
      height: 10px;
    }

    .boy .arm1 {
      left: 86px;
      top: 87px;
      transform: rotate(25deg);
    }

    .boy .arm2 {
      left: 154px;
      top: 80px;
      transform: rotate(-35deg);
    }

    .boy .arm2 .limb {
      height: 95px;
    }

    .boy .leg1 {
      left: 101px;
      top: 170px;
    }

    .boy .leg2 {
      left: 140px;
      top: 170px;
    }

    /* NIÑA */

    .girl .head {
      left: 60px;
      top: 25px;
      width: 54px;
      height: 54px;
    }

    .girl .hair {
      left: 52px;
      top: 17px;
      width: 70px;
      height: 44px;
      border-radius: 45px 45px 25px 25px;
    }

    .girl .hair::after {
      content: "";
      position: absolute;
      right: 4px;
      top: 20px;
      width: 15px;
      height: 60px;
      border-radius: 12px;
      background: #493021;
    }

    .girl .body {
      left: 41px;
      top: 76px;
      width: 92px;
      height: 120px;
      background:
        linear-gradient(
          #fff4aa,
          #f6d653
        );
      clip-path:
        polygon(
          25% 0,
          75% 0,
          100% 100%,
          0 100%
        );
    }

    .girl .eye1 {
      left: 77px;
      top: 47px;
    }

    .girl .eye2 {
      left: 96px;
      top: 47px;
    }

    .girl .smile {
      left: 80px;
      top: 59px;
      width: 16px;
      height: 9px;
    }

    .girl .arm1 {
      left: 38px;
      top: 90px;
    }

    .girl .arm2 {
      left: 120px;
      top: 91px;
    }

    .girl .leg1 {
      left: 66px;
      top: 182px;
    }

    .girl .leg2 {
      left: 96px;
      top: 182px;
    }

    .girl .leg .limb {
      height: 70px;
      background: #c17a91;
    }

    /* ==============================
       RAMO
    ============================== */

    .bouquet {
      position: absolute;
      left: 150px;
      top: 50px;
      width: 190px;
      height: 190px;
      z-index: 12;
      transform-origin: 12% 75%;
      animation: bouquet 9s ease-in-out infinite;
    }

    @keyframes bouquet {
      0% {
        transform: rotate(-12deg) scale(.85);
      }

      45% {
        transform: rotate(-3deg) scale(1.04);
      }

      60% {
        transform: rotate(1deg) scale(1.18);
      }

      78% {
        transform: rotate(-2deg) scale(1.12);
      }

      100% {
        transform: rotate(-12deg) scale(.85);
      }
    }

    .paper {
      position: absolute;
      left: 15px;
      top: 93px;
      width: 90px;
      height: 90px;
      background:
        linear-gradient(
          #fffdf3,
          #efe3bc
        );
      clip-path:
        polygon(
          0 0,
          100% 0,
          70% 100%,
          30% 100%
        );
    }

    .ribbon {
      position: absolute;
      left: 45px;
      top: 120px;
      width: 30px;
      height: 38px;
      background: #ff668d;
      clip-path:
        polygon(
          50% 0,
          100% 35%,
          72% 100%,
          50% 75%,
          28% 100%,
          0 35%
        );
      z-index: 4;
    }

    .flower {
      position: absolute;
      width: 55px;
      height: 55px;
      z-index: 5;
      animation: flowerBob 2.8s ease-in-out infinite;
    }

    @keyframes flowerBob {
      50% {
        transform: translateY(-4px) rotate(2deg);
      }
    }

    .flower .petal {
      position: absolute;
      left: 20px;
      top: 3px;
      width: 15px;
      height: 30px;
      border-radius: 70% 70% 45% 45%;
      background:
        linear-gradient(
          #fff589,
          #ffc928
        );
      transform-origin: 50% 24px;
    }

    .flower .center {
      position: absolute;
      left: 17px;
      top: 17px;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 40% 35%,
          #a77327,
          #5b3719
        );
      z-index: 8;
    }

    /* ==============================
       MENSAJE Y BOTON
    ============================== */

    .message {
      position: absolute;
      left: 50%;
      bottom: 115px;
      transform: translateX(-50%);
      width: min(90vw, 700px);
      z-index: 25;
      text-align: center;
    }

    .message-box {
      display: inline-block;
      padding: 14px 20px;
      border-radius: 22px;
      background: rgba(255,255,255,.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,201,40,.45);
      box-shadow: 0 14px 40px rgba(100,70,10,.15);
      color: #684713;
      font-size: clamp(1rem, 2.6vw, 1.22rem);
      font-weight: 800;
      transition: .4s ease;
    }

    .controls {
      position: absolute;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 30;
      width: min(90vw, 420px);
      text-align: center;
    }

    .btn {
      width: min(360px, 88vw);
      border: none;
      border-radius: 999px;
      padding: 16px 24px;
      font-size: 1.05rem;
      font-weight: 900;
      color: #5c3d0e;
      cursor: pointer;
      background:
        linear-gradient(
          #fff58d,
          #ffd135
        );
      box-shadow:
        0 14px 30px rgba(175,115,0,.25),
        inset 0 2px 0 rgba(255,255,255,.8);
    }

    .btn:active {
      transform: scale(.97);
    }

    /* ==============================
       TRANSICION AL CAMPO
    ============================== */

    .field-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transform: scale(1.06);
      transition:
        opacity 1.7s ease,
        transform 2s ease;
      overflow: hidden;
      background:
        linear-gradient(
          180deg,
          #fffbe1 0%,
          #ffe99b 35%,
          #cbe88d 58%,
          #5d9f4e 100%
        );
    }

    .field-screen.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .field-sun {
      position: absolute;
      top: 7%;
      left: 50%;
      transform: translateX(-50%);
      width: min(25vw, 190px);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(
          circle,
          #fffde4,
          #ffe76b 55%,
          rgba(255,215,60,.25) 70%,
          transparent 72%
        );
      box-shadow:
        0 0 100px 40px rgba(255,224,80,.35);
    }

    .field-message {
      position: absolute;
      top: 10%;
      left: 50%;
      width: min(94vw, 900px);
      transform: translateX(-50%);
      z-index: 120;
      text-align: center;
      opacity: 0;
      animation: none;
    }

    .field-screen.active .field-message {
      animation:
        fieldMessage 1.5s ease 1.1s forwards;
    }

    @keyframes fieldMessage {
      from {
        opacity: 0;
        transform:
          translateX(-50%)
          translateY(25px)
          scale(.9);
      }

      to {
        opacity: 1;
        transform:
          translateX(-50%)
          translateY(0)
          scale(1);
      }
    }

    .field-message h2 {
      font-size: clamp(2.1rem, 8vw, 5.7rem);
      line-height: 1;
      color: #65400c;
      text-shadow:
        0 3px 0 rgba(255,255,255,.7),
        0 10px 30px rgba(118,78,5,.12);
    }

    .field-message p {
      margin-top: 15px;
      font-size: clamp(1rem, 3vw, 1.35rem);
      color: #76511c;
      font-weight: 700;
    }

    /* ==============================
       CAMPO INFINITO
    ============================== */

    .infinite-field {
      position: absolute;
      inset: 0;
      perspective: 650px;
      overflow: hidden;
    }

    .horizon {
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -5%;
      height: 68%;
      transform-origin: center bottom;
      background:
        linear-gradient(
          180deg,
          rgba(126,177,82,.2),
          rgba(60,119,55,.65)
        );
      clip-path:
        polygon(
          0 18%,
          100% 18%,
          100% 100%,
          0 100%
        );
    }

    .flower-layer {
      position: absolute;
      left: -15%;
      width: 130%;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      transform-origin: center bottom;
    }

    .layer1 {
      bottom: 0;
      height: 47%;
      z-index: 15;
    }

    .layer2 {
      bottom: 14%;
      height: 39%;
      transform: scale(.78);
      z-index: 14;
      opacity: .95;
    }

    .layer3 {
      bottom: 26%;
      height: 33%;
      transform: scale(.58);
      z-index: 13;
      opacity: .92;
    }

    .layer4 {
      bottom: 36%;
      height: 28%;
      transform: scale(.42);
      z-index: 12;
      opacity: .9;
    }

    .layer5 {
      bottom: 44%;
      height: 23%;
      transform: scale(.27);
      z-index: 11;
      opacity: .85;
    }

    .field-flower {
      position: relative;
      width: 70px;
      height: 145px;
      flex: 0 0 auto;
      transform-origin: bottom center;
      animation:
        swayField
        var(--speed)
        ease-in-out
        infinite alternate;
      animation-delay: var(--delay);
    }

    @keyframes swayField {
      from {
        transform: rotate(-4deg);
      }

      to {
        transform: rotate(4deg);
      }
    }

    .field-flower .stem {
      position: absolute;
      left: 33px;
      bottom: 0;
      width: 5px;
      height: 105px;
      border-radius: 999px;
      background:
        linear-gradient(
          90deg,
          #3c743f,
          #6aa759
        );
    }

    .field-flower .leaf {
      position: absolute;
      width: 31px;
      height: 14px;
      background:
        linear-gradient(
          135deg,
          #71ae5c,
          #3c7943
        );
      border-radius: 100% 0 100% 0;
    }

    .field-flower .leaf1 {
      left: 34px;
      bottom: 43px;
      transform: rotate(20deg);
    }

    .field-flower .leaf2 {
      left: 6px;
      bottom: 68px;
      transform: rotate(200deg);
    }

    .field-head {
      position: absolute;
      top: 0;
      left: 8px;
      width: 58px;
      height: 58px;
    }

    .field-head .fp {
      position: absolute;
      left: 21px;
      top: 1px;
      width: 16px;
      height: 34px;
      border-radius: 65% 65% 45% 45%;
      background:
        linear-gradient(
          #fff37e,
          #ffc926
        );
      transform-origin: 50% 29px;
      box-shadow:
        inset 0 -3px 3px rgba(150,90,0,.08);
    }

    .field-head .fc {
      position: absolute;
      left: 18px;
      top: 18px;
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 40% 35%,
          #a36d22,
          #543115 70%
        );
      z-index: 4;
    }

    /* ==============================
       MARIPOSAS / PARTICULAS
    ============================== */

    .butterfly {
      position: absolute;
      z-index: 130;
      font-size: 24px;
      animation:
        butterflyFly
        8s
        linear
        infinite;
      opacity: .75;
    }

    @keyframes butterflyFly {
      0% {
        transform:
          translate(-80px, 20vh)
          rotate(-15deg);
      }

      40% {
        transform:
          translate(45vw, 10vh)
          rotate(10deg);
      }

      70% {
        transform:
          translate(75vw, 30vh)
          rotate(-10deg);
      }

      100% {
        transform:
          translate(110vw, 8vh)
          rotate(10deg);
      }
    }

    .floating-heart {
      position: fixed;
      z-index: 200;
      pointer-events: none;
      font-size: 25px;
      animation:
        floatUp
        2.2s
        ease-out
        forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform:
          translate(-50%, 0)
          scale(.4);
      }

      15% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform:
          translate(
            calc(-50% + var(--x)),
            -180px
          )
          rotate(var(--r))
          scale(1.5);
      }
    }

    /* ==============================
       RESPONSIVE
    ============================== */

    @media (max-width: 650px) {

      .header h1 {
        font-size: clamp(2rem, 9vw, 3.3rem);
      }

      .characters {
        bottom: 16vh;
      }

      .boy {
        width: 215px;
        left: -175px;
      }

      .girl {
        width: 150px;
        right: -2%;
      }

      .bouquet {
        width: 155px;
        height: 155px;
        left: 135px;
        top: 62px;
        transform: scale(.9);
      }

      .message {
        bottom: 120px;
      }

      .field-message {
        top: 8%;
      }

      .field-flower {
        width: 54px;
        height: 120px;
      }

      .field-flower .stem {
        left: 26px;
        height: 88px;
      }

      .field-head {
        transform: scale(.8);
        left: 0;
      }

      .flower-layer {
        width: 160%;
        left: -30%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <main class="scene">

    <div class="sun"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <div class="header" id="header">

      <small>
        Un detalle para mi novia
      </small>

      <h1>
        TE AMO MI PEQUEÑA DAMITA
        <span class="heart">❤️</span>
      </h1>

      <p>
        Un pequeño detalle hecho con mucho amor especialmente para ti.
      </p>

    </div>

    <div class="ground"></div>

    <div class="characters" id="characters">

      <!-- NIÑO -->

      <div class="boy" id="boy">

        <div class="hair"></div>

        <div class="head"></div>

        <div class="eye eye1"></div>
        <div class="eye eye2"></div>

        <div class="smile"></div>

        <div class="body"></div>

        <div class="arm arm1">
          <div class="limb"></div>
        </div>

        <div class="arm arm2">
          <div class="limb"></div>
        </div>

        <div class="leg leg1">
          <div class="limb"></div>
          <div class="shoe"></div>
        </div>

        <div class="leg leg2">
          <div class="limb"></div>
          <div class="shoe"></div>
        </div>

        <!-- RAMO -->

        <div class="bouquet" id="bouquet">

          <div class="paper"></div>

          <div class="ribbon"></div>

          <div id="bouquetFlowers"></div>

        </div>

      </div>

      <!-- NIÑA -->

      <div class="girl">

        <div class="hair"></div>

        <div class="head"></div>

        <div class="eye eye1"></div>
        <div class="eye eye2"></div>

        <div class="smile"></div>

        <div class="body"></div>

        <div class="arm arm1">
          <div class="limb"></div>
        </div>

        <div class="arm arm2">
          <div class="limb"></div>
        </div>

        <div class="leg leg1">
          <div class="limb"></div>
          <div class="shoe"></div>
        </div>

        <div class="leg leg2">
          <div class="limb"></div>
          <div class="shoe"></div>
        </div>

      </div>

    </div>

    <div class="message" id="firstMessage">

      <div class="message-box">
        Tengo algo más que quiero mostrarte... 💛
      </div>

    </div>

    <div class="controls" id="controls">

      <button class="btn" id="showField">

        Estas flores son para ti 🌻

      </button>

    </div>

  </main>

  <!-- ==============================
       CAMPO DE FLORES
  ============================== -->

  <section
    class="field-screen"
    id="fieldScreen"
  >

    <div class="field-sun"></div>

    <div class="field-message">

      <h2>
        TODAS ESTAS FLORES
        <br>
        SON PARA TI 💛
      </h2>

      <p>
        Y aun así no serían suficientes para representar todo lo bonito que siento por ti.
      </p>

    </div>

    <div class="infinite-field">

      <div class="horizon"></div>

      <div
        class="flower-layer layer5"
        id="layer5"
      ></div>

      <div
        class="flower-layer layer4"
        id="layer4"
      ></div>

      <div
        class="flower-layer layer3"
        id="layer3"
      ></div>

      <div
        class="flower-layer layer2"
        id="layer2"
      ></div>

      <div
        class="flower-layer layer1"
        id="layer1"
      ></div>

    </div>

    <div
      class="butterfly"
      style="
        top:30%;
        animation-delay:-2s;
      "
    >
      🦋
    </div>

    <div
      class="butterfly"
      style="
        top:44%;
        animation-delay:-5s;
        animation-duration:11s;
      "
    >
      🦋
    </div>

  </section>

  <script>

    /* ==============================
       CREA UNA FLOR
    ============================== */

    function createFlower(className = "flower") {

      const flower =
        document.createElement("div");

      flower.className = className;

      const head =
        document.createElement("div");

      head.className =
        className === "flower"
        ? "flower-head"
        : "field-head";

      for (
        let i = 0;
        i < 8;
        i++
      ) {

        const petal =
          document.createElement("span");

        petal.className =
          className === "flower"
          ? "petal"
          : "fp";

        petal.style.transform =
          `rotate(${i * 45}deg)`;

        head.appendChild(petal);

      }

      const center =
        document.createElement("span");

      center.className =
        className === "flower"
        ? "center"
        : "fc";

      head.appendChild(center);

      flower.appendChild(head);

      return flower;

    }

    /* ==============================
       RAMO PRINCIPAL
    ============================== */

    const bouquetPositions = [

      [10, 20, 1.15],

      [42, 0, 1.08],

      [72, 19, 1.1],

      [100, 4, 1],

      [25, 48, 1.05],

      [58, 43, 1.15],

      [94, 49, .97],

      [122, 35, .9]

    ];

    const bouquetFlowers =
      document.getElementById(
        "bouquetFlowers"
      );

    bouquetPositions.forEach(
      ([x, y, scale], index) => {

        const flower =
          createFlower("flower");

        flower.style.left =
          x + "px";

        flower.style.top =
          y + "px";

        flower.style.transform =
          `scale(${scale})`;

        flower.style.animationDelay =
          index * .15 + "s";

        bouquetFlowers.appendChild(
          flower
        );

      }
    );

    /* ==============================
       CAMPO DE FLORES
    ============================== */

    function createFieldFlower() {

      const flower =
        document.createElement("div");

      flower.className =
        "field-flower";

      flower.style.setProperty(
        "--speed",
        (
          2.4 +
          Math.random() * 3
        ) + "s"
      );

      flower.style.setProperty(
        "--delay",
        (
          Math.random() * -4
        ) + "s"
      );

      const stem =
        document.createElement("div");

      stem.className =
        "stem";

      const leaf1 =
        document.createElement("div");

      leaf1.className =
        "leaf leaf1";

      const leaf2 =
        document.createElement("div");

      leaf2.className =
        "leaf leaf2";

      flower.appendChild(stem);

      flower.appendChild(leaf1);

      flower.appendChild(leaf2);

      const head =
        document.createElement("div");

      head.className =
        "field-head";

      for (
        let i = 0;
        i < 8;
        i++
      ) {

        const petal =
          document.createElement("span");

        petal.className =
          "fp";

        petal.style.transform =
          `rotate(${i * 45}deg)`;

        head.appendChild(petal);

      }

      const center =
        document.createElement("span");

      center.className =
        "fc";

      head.appendChild(center);

      flower.appendChild(head);

      return flower;

    }

    function populateLayer(
      id,
      count
    ) {

      const layer =
        document.getElementById(id);

      layer.innerHTML = "";

      for (
        let i = 0;
        i < count;
        i++
      ) {

        const flower =
          createFieldFlower();

        flower.style.marginLeft =
          (
            -7 +
            Math.random() * 15
          ) + "px";

        flower.style.marginBottom =
          (
            -8 +
            Math.random() * 16
          ) + "px";

        layer.appendChild(
          flower
        );

      }

    }

    function buildInfiniteField() {

      const width =
        window.innerWidth;

      const base =
        Math.max(
          16,
          Math.floor(
            width / 58
          )
        );

      populateLayer(
        "layer1",
        base + 10
      );

      populateLayer(
        "layer2",
        base + 15
      );

      populateLayer(
        "layer3",
        base + 20
      );

      populateLayer(
        "layer4",
        base + 26
      );

      populateLayer(
        "layer5",
        base + 32
      );

    }

    buildInfiniteField();

    window.addEventListener(
      "resize",
      buildInfiniteField
    );

    /* ==============================
       CORAZONES
    ============================== */

    function createHeart(
      x,
      y
    ) {

      const heart =
        document.createElement("div");

      heart.className =
        "floating-heart";

      heart.textContent =
        Math.random() > .5
        ? "💛"
        : "❤️";

      heart.style.left =
        x + "px";

      heart.style.top =
        y + "px";

      heart.style.setProperty(
        "--x",
        (
          -120 +
          Math.random() * 240
        ) + "px"
      );

      heart.style.setProperty(
        "--r",
        (
          -50 +
          Math.random() * 100
        ) + "deg"
      );

      document.body.appendChild(
        heart
      );

      setTimeout(
        () => heart.remove(),
        2300
      );

    }

    /* ==============================
       BOTON
    ============================== */

    const button =
      document.getElementById(
        "showField"
      );

    const fieldScreen =
      document.getElementById(
        "fieldScreen"
      );

    const characters =
      document.getElementById(
        "characters"
      );

    const header =
      document.getElementById(
        "header"
      );

    const controls =
      document.getElementById(
        "controls"
      );

    const firstMessage =
      document.getElementById(
        "firstMessage"
      );

    button.addEventListener(
      "click",
      () => {

        const rect =
          button.getBoundingClientRect();

        const x =
          rect.left +
          rect.width / 2;

        const y =
          rect.top;

        for (
          let i = 0;
          i < 14;
          i++
        ) {

          setTimeout(
            () =>
              createHeart(
                x,
                y
              ),
            i * 70
          );

        }

        button.textContent =
          "Todas estas flores son para ti 💛";

        setTimeout(
          () => {

            header.style.opacity =
              "0";

            characters.style.opacity =
              "0";

            controls.style.opacity =
              "0";

            firstMessage.style.opacity =
              "0";

          },
          500
        );

        setTimeout(
          () => {

            fieldScreen.classList.add(
              "active"
            );

          },
          1200
        );

      }
    );

  </script>

</body>
</html>
